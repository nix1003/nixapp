<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex">
  <title>Compose | NixApp Inbox</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <style>
    .inbox-wrapper { background:#fff; border-radius:8px; padding:2rem; box-shadow:0 4px 10px rgba(0,0,0,0.1); width:100%; max-width:800px; margin:2rem auto; box-sizing:border-box; }
    .inbox-wrapper h2 { text-align:center; color:#444; margin-top:0; word-break:break-all; }
    .msg-list { list-style:none; padding:0; margin:0; }
    .msg-list li { border-bottom:1px solid #ddd; }
    .msg-list a { display:block; padding:0.75rem 0.5rem; color:#222; text-decoration:none; }
    .msg-list a:hover { background:#f5f5f5; }
    .msg-list .unread { font-weight:bold; }
    .muted { color:#777; font-size:0.85rem; font-weight:normal; }
    .del-btn { background:crimson; color:#fff; border:none; border-radius:6px; padding:0.4rem 0.8rem; cursor:pointer; }
    .top-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; gap:0.5rem; flex-wrap:wrap; }
    .flash { background:#e8f5e9; color:#2e7d32; border-radius:6px; padding:0.6rem 0.9rem; margin-bottom:1rem; text-align:center; }
    .compose label { display:block; font-weight:bold; margin:0.8rem 0 0.3rem; color:#444; }
    .compose input[type=text], .compose textarea { width:100%; box-sizing:border-box; padding:0.6rem; font-size:1rem; border:1px solid #ccc; border-radius:6px; font-family:inherit; }
    .from-row { display:flex; align-items:center; gap:0.4rem; }
    .from-row input { flex:1; }
    .send-btn { margin-top:1rem; border:none; cursor:pointer; font-size:1rem; padding:0.6rem 1.4rem; }
    .send-btn[disabled] { opacity:0.5; cursor:not-allowed; }
    .warn { background:#fff8e1; color:#8a6d00; border-radius:6px; padding:0.6rem 0.9rem; margin-bottom:1rem; }
    .err { background:#fdecea; color:#b71c1c; border-radius:6px; padding:0.6rem 0.9rem; margin-bottom:1rem; }
  </style>
</head>
<body>
  <div id="particles-js"></div>
  <div class="content">
    <header>
      <a href="{{ url_for('home') }}" class="home-button" aria-label="Home">
        <svg xmlns="http://www.w3.org/2000/svg" fill="white" viewBox="0 0 24 24" width="20" height="20">
          <path d="M3 9.75L12 3l9 6.75V21a1 1 0 0 1-1 1h-6v-6h-4v6H4a1 1 0 0 1-1-1V9.75z"/>
        </svg>
      </a>
      <h1>NixApp</h1>
      <a href="{{ url_for('logout') }}"><button id="loginBtn">Logout</button></a>
    </header>

    <main class="container">
      <div class="inbox-wrapper">
        <div class="top-row">
          <a class="view-button" href="{{ url_for('inbox_message', msg_id=original.id) if original else url_for('inbox') }}">&larr; Back</a>
        </div>
        <h2>{{ 'Reply' if original else 'New email' }}</h2>

        {% if not can_send %}
        <div class="warn">Sending isn't set up yet. Add <b>RESEND_API_KEY</b> on Render first.</div>
        {% endif %}
        {% if error %}<div class="err">{{ error }}</div>{% endif %}

        <form method="post" class="compose">
          {% if original %}<input type="hidden" name="reply_to" value="{{ original.id }}">{% endif %}
          <label>From</label>
          <div class="from-row">
            <input type="text" name="from_local" value="{{ form.from_local }}" required maxlength="64" autocomplete="off">
            <span>@{{ domain }}</span>
          </div>
          <label>To</label>
          <input type="text" name="to" value="{{ form.to }}" placeholder="someone@example.com (separate several with commas)" required>
          <label>Subject</label>
          <input type="text" name="subject" value="{{ form.subject }}" required maxlength="500">
          <label>Message</label>
          <textarea name="body" rows="12">{{ form.body }}</textarea>
          <button type="submit" class="view-button send-btn" {% if not can_send %}disabled{% endif %}>Send</button>
        </form>
      </div>
    </main>

    <footer>&copy; 2025 NixApp</footer>
  </div>

  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
  <script>
    particlesJS.load('particles-js', '{{ url_for("static", filename="particles.json") }}');
  </script>
</body>
</html>
